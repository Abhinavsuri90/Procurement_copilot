# Labelled evaluation set: identical for architectures A (single agent), B (staged) and R (rules only).
# Labels were written from data/procurement_policy.md and the starter data BEFORE any evaluation run, and committed
# before the first results. Changes after that are logged with justification in evals/LABEL_CHANGES.md.
#
# expected.recommendation      the correct next action; `acceptable` lists alternatives only where the policy truly
#                              allows either
# expected.approvals           exact set of approver/review roles the policy requires (provisional when info missing)
# expected.must_flag           risk-flag codes that must be present; must_not_flag: codes that must be absent
# expected.missing_fields      request fields that must be reported missing
# expected.handoff_required    whether a human must review beyond routine sign-off (escalation floor)
# expected.next_owner_role     acceptable owners of the next step
# Assumptions used by labels (docs/ASSUMPTIONS.md): A3 expiry on day 365; A4 unknown data = sensitive;
# A6 unverifiable data region + sensitive data = Privacy review; A7 personal/unknown data stored outside the
# region = Legal (cross-region) review.

fixtures:   # reusable data overlays for synthetic vendors (merged over the starter data for that case only)
  approved_vendor: &approved_vendor
    procurement_status: Approved
    security_status: Approved
    security_review_date: "2026-05-01"
    legal_terms_status: Approved
    notes: Standard vendor
  approved_risk: &approved_risk
    risk_level: low
    security_review_status: approved
    last_review_date: "2026-05-01"
    processes_personal_data: false
    stores_data_outside_region: false
    notes: Current assessment.

