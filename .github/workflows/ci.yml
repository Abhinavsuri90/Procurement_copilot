name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Replay the committed evaluation offline (no API key)
        run: LLM_MODE=replay python -m evals.run_eval --arch A B R --runs 3 --workers 8 --check
